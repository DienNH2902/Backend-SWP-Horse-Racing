<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Race Broadcast Test</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #1a1a2e; color: #eee; padding: 20px; }
    h2 { color: #e94560; margin-bottom: 16px; }
    h4 { color: #7f8fa6; margin: 4px 0 10px; font-weight: normal; }

    .row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }

    input, button, select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      font-family: monospace;
      font-size: 13px;
    }
    input { background: #16213e; color: #eee; flex: 1; min-width: 200px; }
    input.small { flex: none; width: 110px; min-width: 0; }
    select { background: #16213e; color: #eee; }
    button {
      background: #e94560;
      color: white;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #c73652; }
    button.green { background: #2ecc71; }
    button.green:hover { background: #27ae60; }
    button.gray { background: #555; }
    button.gray:hover { background: #444; }
    button.blue { background: #3498db; }
    button.blue:hover { background: #2980b9; }
    button.purple { background: #9b59b6; }
    button.purple:hover { background: #8e44ad; }
    button.cyan { background: #16a085; }
    button.cyan:hover { background: #128c76; }
    button:disabled { background: #333; color: #777; cursor: not-allowed; }

    input[type="range"] { flex: 1; min-width: 200px; accent-color: #9b59b6; }

    .status {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 16px;
    }
    .status.connected { background: #2ecc71; color: #000; }
    .status.disconnected { background: #e74c3c; color: #fff; }

    .section {
      background: #14142b;
      border: 1px solid #2a2a45;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    /* Track */
    #track {
      background: #16213e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      min-height: 200px;
    }
    .lane {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .lane-label {
      width: 70px;
      font-size: 11px;
      color: #aaa;
      text-align: right;
      flex-shrink: 0;
    }
    .lane-track {
      flex: 1;
      background: #0f3460;
      border-radius: 4px;
      height: 24px;
      position: relative;
      overflow: hidden;
    }
    .horse {
      position: absolute;
      top: 2px;
      width: 28px;
      height: 20px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: left 0.45s linear;
      left: 0%;
    }
    .lane-progress {
      width: 48px;
      font-size: 11px;
      color: #aaa;
      text-align: right;
      flex-shrink: 0;
    }

    /* Log */
    #log {
      background: #0d0d1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      height: 240px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.6;
    }
    .log-tick    { color: #888; }
    .log-event   { color: #f39c12; font-weight: bold; }
    .log-finish  { color: #2ecc71; font-weight: bold; }
    .log-system  { color: #3498db; }
    .log-error   { color: #e74c3c; }
    .log-snap    { color: #9b59b6; }
    .log-api     { color: #16a085; font-weight: bold; }
    .log-api-err { color: #e74c3c; font-weight: bold; }

    /* Result */
    #result-table {
      display: none;
      background: #16213e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }
    #result-table h3 { color: #2ecc71; margin-bottom: 8px; }
    .result-row {
      display: flex;
      gap: 12px;
      padding: 4px 0;
      border-bottom: 1px solid #222;
      font-size: 13px;
    }
    .rank-1 { color: #f1c40f; }
    .rank-2 { color: #bdc3c7; }
    .rank-3 { color: #e67e22; }

    #tick-counter {
      color: #aaa;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: #2a2a45;
      color: #888;
      margin-left: 6px;
    }

    .status-badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #2a2a45;
      color: #888;
    }
    .status-badge.on  { background: #16a085; color: #fff; }
    .status-badge.off { background: #2a2a45; color: #777; }

    #replay-controls { display: none; }
    #replay-tick-label { font-size: 12px; color: #aaa; width: 90px; flex-shrink: 0; }
  </style>
</head>
<body>

<h2>🏇 Race Broadcast Test</h2>

<!-- Config -->
<div class="section">
  <div class="row">
    <input id="inp-token"  placeholder="JWT Token (không cần Bearer)" />
    <input id="inp-host"   placeholder="Host (mặc định localhost:9000)" value="localhost:9000" style="max-width:220px" />
  </div>
  <div class="row">
    <input id="inp-race"   placeholder="Race ID" />
    <button onclick="connect()"    class="green">Connect WS</button>
    <button onclick="disconnect()" class="gray">Disconnect</button>
  </div>
  <div class="row">
    <button onclick="joinRace()">Join Race</button>
    <button onclick="leaveRace()" class="gray">Leave Race</button>
  </div>
  <div id="conn-status" class="status disconnected">● Disconnected</div>
</div>

<!-- REST API triggers -->
<div class="section">
  <h4>REST API — Live broadcast (qua WebSocket)<span class="badge">Referee</span></h4>
  <div class="row">
    <input id="inp-from-tick" class="small" type="number" min="0" placeholder="fromTick" value="0" />
    <button onclick="startLive()" class="blue">▶ Start Live (Referee)</button>
    <button onclick="checkStatus()" class="cyan">ℹ️ Check Status</button>
  </div>
  <div class="row" id="status-badges" style="display:none">
    <span id="badge-live" class="status-badge">● Live: —</span>
  </div>
</div>

<!-- Client-driven replay -->
<div class="section">
  <h4>Replay — client-driven <span class="badge">GET /replay-data 1 lần, phát local, không dùng socket</span></h4>
  <div class="row">
    <button onclick="loadReplayData()" class="purple">🔁 Load Replay Data</button>
  </div>
  <div class="row" id="replay-controls">
    <button onclick="playReplay()" class="green">▶ Play</button>
    <button onclick="pauseReplay()" class="gray">⏸ Pause</button>
    <select id="replay-speed" onchange="setReplaySpeed(this.value)">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
      <option value="4">4x</option>
    </select>
  </div>
  <div class="row" id="replay-controls-2" style="display:none">
    <span id="replay-tick-label">Tick: 0 / 0</span>
    <input id="replay-slider" type="range" min="0" max="0" value="0"
           oninput="seekReplay(parseInt(this.value, 10))" />
  </div>
</div>

<!-- Track visualization -->
<div id="track">
  <div id="tick-counter">Tick: — / —</div>
  <div id="lanes"></div>
</div>

<!-- Log -->
<div id="log"></div>

<!-- Result -->
<div id="result-table">
  <h3>🏆 Kết quả đua</h3>
  <div id="result-rows"></div>
</div>

<script>
  let socket = null;
  let horses = {};       // horseId → { lane, color, name }
  let maxTick = 0;
  let currentTick = 0;

  const COLORS = [
    '#e74c3c','#3498db','#2ecc71','#f39c12',
    '#9b59b6','#1abc9c','#e67e22','#e91e63'
  ];
  const EMOJIS = ['🐴','🐎','🦄','🐴','🐎','🦄','🐴','🐎'];

  // ── Client-driven replay state ───────────────────────────────────────────
  // KHÔNG dùng socket cho replay nữa — chỉ fetch 1 lần rồi tự chạy local.
  let replayData = null;         // { raceId, maxTick, tickIntervalMs, ticks, events, results }
  let replayEventsByTick = {};   // tickNumber -> events[]
  let replayHorseState = {};     // horseId -> {horseId, progress, currentSpeed, lane} mới nhất
  let replayTickIndex = 0;
  let replayTimer = null;
  let replaySpeedMultiplier = 1;

  // ── Helpers ───────────────────────────────────────────────────────────────
  function getHost()  { return document.getElementById('inp-host').value.trim() || 'localhost:9000'; }
  function getToken() { return document.getElementById('inp-token').value.trim(); }
  function getRaceId(){ return document.getElementById('inp-race').value.trim(); }

  // ── Logging ───────────────────────────────────────────────────────────────
  function log(msg, cls = '') {
    const el = document.getElementById('log');
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  // ── REST API calls ────────────────────────────────────────────────────────
  async function callApi(method, path, { silentSuccess = false } = {}) {
    const token = getToken();
    if (!token) { log('⚠️ Nhập JWT token trước', 'log-error'); return null; }

    const url = `http://${getHost()}${path}`;
    log(`→ ${method} ${path}`, 'log-api');

    try {
      const res = await fetch(url, {
        method,
        headers: { 'Authorization': `Bearer ${token}` },
      });

      let data;
      try { data = await res.json(); } catch { data = null; }

      if (!res.ok) {
        const msg = data?.message || res.statusText;
        log(`✗ ${res.status} — ${Array.isArray(msg) ? msg.join('; ') : msg}`, 'log-api-err');
        return null;
      }

      if (!silentSuccess) {
        log(`✓ ${res.status} — ${data?.message ?? JSON.stringify(data)}`, 'log-api');
      }
      return data;
    } catch (err) {
      log(`✗ Network error: ${err.message} (kiểm tra host/CORS)`, 'log-api-err');
      return null;
    }
  }

  async function startLive() {
    const raceId = getRaceId();
    if (!raceId) { log('⚠️ Nhập Race ID', 'log-error'); return; }
    const fromTick = document.getElementById('inp-from-tick').value.trim() || '0';
    await callApi('POST', `/race-broadcast/${raceId}/start?fromTick=${fromTick}`);
  }

  // checkStatus() — SỬA: server không còn trả isReplaying (route /replay bị
  // xoá, thay bằng GET /replay-data không có session để track), nên chỉ còn
  // đọc isBroadcasting. Badge "Replay" cũ đã bỏ khỏi HTML luôn.
  async function checkStatus() {
    const raceId = getRaceId();
    if (!raceId) { log('⚠️ Nhập Race ID', 'log-error'); return; }
    const data = await callApi('GET', `/race-broadcast/${raceId}/status`, { silentSuccess: true });
    if (data) {
      log(`ℹ️ isBroadcasting=${data.isBroadcasting}`, 'log-api');

      const badges = document.getElementById('status-badges');
      const badgeLive = document.getElementById('badge-live');
      badges.style.display = 'flex';
      badgeLive.textContent = `● Live: ${data.isBroadcasting ? 'ON' : 'off'}`;
      badgeLive.className = 'status-badge ' + (data.isBroadcasting ? 'on' : 'off');
    }
  }

  // ── Track setup ───────────────────────────────────────────────────────────
  function initTrack(horseList) {
    const lanes = document.getElementById('lanes');
    lanes.innerHTML = '';
    horses = {};

    horseList.forEach((h, i) => {
      const color = COLORS[i % COLORS.length];
      const emoji = EMOJIS[i % EMOJIS.length];
      horses[h.horseId] = { lane: h.lane, color, emoji, index: i };

      const row = document.createElement('div');
      row.className = 'lane';
      row.innerHTML = `
        <div class="lane-label">Lane ${h.lane}</div>
        <div class="lane-track" id="track-${h.horseId}">
          <div class="horse" id="horse-${h.horseId}"
               style="background:${color}">${emoji}</div>
        </div>
        <div class="lane-progress" id="prog-${h.horseId}">0%</div>
      `;
      lanes.appendChild(row);
    });
  }

  function updateHorse(horseId, progress, instant = false) {
    const el = document.getElementById(`horse-${horseId}`);
    const prog = document.getElementById(`prog-${horseId}`);
    if (!el) return;

    const pct = Math.min(progress * 96, 96);
    if (instant) el.style.transition = 'none';
    else el.style.transition = 'left 0.45s linear';
    el.style.left = pct + '%';
    if (prog) prog.textContent = (progress * 100).toFixed(1) + '%';
  }

  // ── Client-driven replay ─────────────────────────────────────────────────

  async function loadReplayData() {
    const raceId = getRaceId();
    if (!raceId) { log('⚠️ Nhập Race ID', 'log-error'); return; }

    stopReplayTimer();

    // GET /replay-data — trả TOÀN BỘ ticks/events/results 1 lần, không còn
    // POST /replay tạo session server-side nữa.
    const data = await callApi('GET', `/race-broadcast/${raceId}/replay-data`, { silentSuccess: true });
    if (!data) return;

    replayData = data;
    replayEventsByTick = {};
    data.events.forEach(ev => {
      (replayEventsByTick[ev.tickNumber] ??= []).push(ev);
    });
    replayHorseState = {};
    replayTickIndex = 0;

    log(
      `✓ Đã tải replay — ${data.maxTick + 1} ticks, ${data.events.length} events, ` +
      `interval gốc ${data.tickIntervalMs}ms`,
      'log-api',
    );

    // Gom danh sách ngựa từ TOÀN BỘ ticks (không chỉ tick 0) — phòng trường
    // hợp tick 0 thiếu 1 ngựa nào đó, giống lý do phải merge theo horseId
    // ở phần snapshot live.
    const horseList = [];
    const seen = new Set();
    for (const frame of data.ticks) {
      for (const h of frame.horses) {
        if (!seen.has(h.horseId)) {
          seen.add(h.horseId);
          horseList.push(h);
        }
      }
    }
    initTrack(horseList);

    document.getElementById('replay-controls').style.display = 'flex';
    document.getElementById('replay-controls-2').style.display = 'flex';
    const slider = document.getElementById('replay-slider');
    slider.min = 0;
    slider.max = data.maxTick;
    slider.value = 0;

    seekReplay(0);
  }

  // Merge toàn bộ tick 0..targetIndex theo horseId — GIỐNG HỆT logic merge
  // server dùng cho live snapshot: ngựa không xuất hiện ở 1 tick nào đó
  // (ví dụ đã về đích sớm) vẫn giữ nguyên progress cuối cùng thay vì "biến mất"
  // khi tua (seek) tới sau thời điểm đó.
  function computeReplayStateAt(targetIndex) {
    const state = {};
    for (let t = 0; t <= targetIndex && t < replayData.ticks.length; t++) {
      for (const h of replayData.ticks[t].horses) {
        state[h.horseId] = h;
      }
    }
    return state;
  }

  function seekReplay(targetIndex) {
    if (!replayData) return;
    targetIndex = Math.max(0, Math.min(targetIndex, replayData.maxTick));

    replayHorseState = computeReplayStateAt(targetIndex);
    Object.values(replayHorseState).forEach(h => updateHorse(h.horseId, h.progress, true));

    replayTickIndex = targetIndex;
    document.getElementById('replay-slider').value = targetIndex;
    document.getElementById('replay-tick-label').textContent = `Tick: ${targetIndex} / ${replayData.maxTick}`;
    document.getElementById('tick-counter').textContent =
      `Tick: ${targetIndex} / ${replayData.maxTick} (replay)`;

    if (targetIndex >= replayData.maxTick) {
      renderReplayResults();
    } else {
      document.getElementById('result-table').style.display = 'none';
    }
  }

  function stepReplayForward() {
    if (!replayData) return;
    if (replayTickIndex >= replayData.maxTick) {
      pauseReplay();
      return;
    }
    replayTickIndex++;

    const frame = replayData.ticks[replayTickIndex];
    frame.horses.forEach(h => {
      replayHorseState[h.horseId] = h;
      updateHorse(h.horseId, h.progress);
    });

    (replayEventsByTick[replayTickIndex] || []).forEach(ev => {
      const icons = { stumble: '💥', burst: '⚡', overtake: '🔄', lead_change: '🚩' };
      const icon = icons[ev.eventType] || '❓';
      log(
        `${icon} [${ev.eventType.toUpperCase()}] tick=${ev.tickNumber} ` +
        `horse=${ev.primaryHorseId.slice(-6)}` +
        (ev.secondaryHorseId ? ` vs ${ev.secondaryHorseId.slice(-6)}` : ''),
        'log-event',
      );
    });

    document.getElementById('replay-slider').value = replayTickIndex;
    document.getElementById('replay-tick-label').textContent = `Tick: ${replayTickIndex} / ${replayData.maxTick}`;
    document.getElementById('tick-counter').textContent =
      `Tick: ${replayTickIndex} / ${replayData.maxTick} (replay)`;

    if (replayTickIndex % 10 === 0) log(`⏱ Replay tick ${replayTickIndex}`, 'log-tick');

    if (replayTickIndex >= replayData.maxTick) {
      pauseReplay();
      renderReplayResults();
    }
  }

  function playReplay() {
    if (!replayData) { log('⚠️ Chưa tải replay data — bấm "Load Replay Data" trước', 'log-error'); return; }
    if (replayTimer) return; // đang chạy rồi

    if (replayTickIndex >= replayData.maxTick) seekReplay(0); // hết rồi → phát lại từ đầu

    const intervalMs = replayData.tickIntervalMs / replaySpeedMultiplier;
    replayTimer = setInterval(stepReplayForward, intervalMs);
    log(`▶️ Play replay (x${replaySpeedMultiplier})`, 'log-system');
  }

  function pauseReplay() {
    if (replayTimer) {
      clearInterval(replayTimer);
      replayTimer = null;
      log('⏸ Pause replay', 'log-system');
    }
  }

  function stopReplayTimer() {
    if (replayTimer) { clearInterval(replayTimer); replayTimer = null; }
  }

  function setReplaySpeed(value) {
    replaySpeedMultiplier = parseFloat(value);
    if (replayTimer) { // đang chạy → restart interval theo speed mới ngay
      stopReplayTimer();
      playReplay();
    }
  }

  function renderReplayResults() {
    if (!replayData?.results?.length) return;
    log('🏆 REPLAY tới đích! Kết quả:', 'log-finish');

    const medals = ['🥇','🥈','🥉'];
    const table = document.getElementById('result-table');
    const rows  = document.getElementById('result-rows');
    table.style.display = 'block';
    rows.innerHTML = '';
    replayData.results.forEach(r => {
      const cls = r.rawRank <= 3 ? `rank-${r.rawRank}` : '';
      const medal = medals[r.rawRank - 1] || '';
      const row = document.createElement('div');
      row.className = `result-row ${cls}`;
      row.innerHTML = `
        <span style="width:30px">${medal}</span>
        <span style="width:24px">#${r.rawRank}</span>
        <span>${r.horseId.slice(-12)}</span>
        <span style="color:#aaa">${new Date(r.finishedTime).toLocaleTimeString()}</span>
      `;
      rows.appendChild(row);
    });
  }

  // ── Connect (chỉ dùng cho LIVE — replay không dùng socket nữa) ────────────
  function connect() {
    if (socket?.connected) { log('Đã connected rồi', 'log-system'); return; }

    const token = getToken();
    const host  = getHost();

    if (!token) { log('⚠️ Nhập JWT token trước', 'log-error'); return; }

    log(`Connecting to ws://${host}/race ...`, 'log-system');

    socket = io(`http://${host}/race`, {
      auth: { token: `Bearer ${token}` },
      transports: ['polling', 'websocket'],
    });

    socket.on('connect', () => {
      document.getElementById('conn-status').className = 'status connected';
      document.getElementById('conn-status').textContent = '● Connected: ' + socket.id;
      log('✅ Connected: ' + socket.id, 'log-system');
    });

    socket.on('disconnect', () => {
      document.getElementById('conn-status').className = 'status disconnected';
      document.getElementById('conn-status').textContent = '● Disconnected';
      log('❌ Disconnected', 'log-error');
    });

    socket.on('connect_error', (err) => {
      log('❌ Connect error: ' + err.message, 'log-error');
    });

    // ── Events (LIVE) ───────────────────────────────────────────────────
    socket.on('joined', (data) => {
      log('🏇 Joined race: ' + data.raceId, 'log-system');
    });

    // Catch-up: join giữa chừng 1 buổi live đang chạy
    socket.on('race_snapshot', (data) => {
      log(`📸 Catch-up snapshot tick=${data.tickNumber} (${data.horses.length} ngựa)`, 'log-snap');
      if (!Object.keys(horses).length) {
        initTrack(data.horses);
      }
      data.horses.forEach(h => updateHorse(h.horseId, h.progress, true));
      currentTick = data.tickNumber;
      document.getElementById('tick-counter').textContent =
        `Tick: ${currentTick} (catch-up)`;
    });

    // Tick frame mỗi 500ms — CHỈ còn xảy ra cho live, replay không emit qua đây nữa
    socket.on('race_tick', (frame) => {
      currentTick = frame.tickNumber;
      if (maxTick < currentTick) maxTick = currentTick;

      let justInited = false;
      if (!Object.keys(horses).length && frame.horses.length) {
        initTrack(frame.horses);
        document.getElementById('result-table').style.display = 'none';
        justInited = true;
      }

      frame.horses.forEach(h => updateHorse(h.horseId, h.progress));

      document.getElementById('tick-counter').textContent =
        `Tick: ${currentTick} / ~${maxTick}`;

      if (frame.tickNumber % 10 === 0) {
        log(`⏱ Tick ${frame.tickNumber}`, 'log-tick');
      }
    });

    socket.on('race_event', (event) => {
      const icons = {
        stumble: '💥', burst: '⚡',
        overtake: '🔄', lead_change: '🚩'
      };
      const icon = icons[event.eventType] || '❓';
      log(
        `${icon} [${event.eventType.toUpperCase()}] tick=${event.tickNumber} ` +
        `horse=${event.primaryHorseId.slice(-6)}` +
        (event.secondaryHorseId ? ` vs ${event.secondaryHorseId.slice(-6)}` : ''),
        'log-event'
      );
    });

    socket.on('race_finished', (data) => {
      log('🏆 RACE FINISHED! Kết quả:', 'log-finish');

      const medals = ['🥇','🥈','🥉'];
      data.results.forEach(r => {
        const medal = medals[r.rawRank - 1] || `#${r.rawRank}`;
        log(`  ${medal} Rank ${r.rawRank}: ${r.horseId.slice(-8)}`, 'log-finish');
      });

      const table = document.getElementById('result-table');
      const rows  = document.getElementById('result-rows');
      table.style.display = 'block';
      rows.innerHTML = '';
      data.results.forEach(r => {
        const cls = r.rawRank <= 3 ? `rank-${r.rawRank}` : '';
        const medal = medals[r.rawRank - 1] || '';
        const row = document.createElement('div');
        row.className = `result-row ${cls}`;
        row.innerHTML = `
          <span style="width:30px">${medal}</span>
          <span style="width:24px">#${r.rawRank}</span>
          <span>${r.horseId.slice(-12)}</span>
          <span style="color:#aaa">${new Date(r.finishedTime).toLocaleTimeString()}</span>
        `;
        rows.appendChild(row);
      });

      document.getElementById('tick-counter').textContent =
        `Tick: ${currentTick} — FINISHED ✅`;
    });
  }

  function disconnect() {
    socket?.disconnect();
    socket = null;
  }

  function joinRace() {
    if (!socket?.connected) { log('⚠️ Connect trước', 'log-error'); return; }
    const raceId = getRaceId();
    if (!raceId) { log('⚠️ Nhập Race ID', 'log-error'); return; }
    log(`Joining race ${raceId}...`, 'log-system');
    socket.emit('join_race', { raceId });
  }

  function leaveRace() {
    if (!socket?.connected) return;
    const raceId = getRaceId();
    socket.emit('leave_race', { raceId });
    log('Left race ' + raceId, 'log-system');
  }
</script>
</body>
</html>
